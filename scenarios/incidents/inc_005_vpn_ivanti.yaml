id: INC-005
type: vpn_exploit
title: Exploitation de la passerelle VPN Ivanti Connect Secure
description: >
  La passerelle VPN de l'organisation est compromise sans aucune authentification par
  l'enchaînement de deux vulnérabilités. L'attaquant y dépose un webshell, modifie la page
  de connexion pour récupérer les identifiants des utilisateurs nomades, puis utilise un
  compte d'administration pour rebondir vers l'Active Directory et exfiltrer des données
  sensibles.
based_on: >
  Exploitation massive, à partir de décembre 2023, de CVE-2023-46805 et CVE-2024-21887 sur
  les passerelles Ivanti Connect Secure, rendue publique par l'éditeur le 10 janvier 2024 ;
  de nombreux équipements compromis dans le monde et alertes du CERT-FR et de la
  CISA. Les VPN SSL font partie des vecteurs d'accès initial les plus fréquemment observés.
cve_references:
  - id: CVE-2023-46805
    nom: Contournement d'authentification (Ivanti Connect Secure / Policy Secure)
    description: Accès à des ressources protégées du composant web sans authentification.
  - id: CVE-2024-21887
    nom: Injection de commande (Ivanti Connect Secure / Policy Secure)
    description: >
      Exécution de commandes arbitraires par un administrateur authentifié ; chaînée avec
      CVE-2023-46805, elle permet une exécution de code à distance sans authentification.
initial_vector: Passerelle VPN SSL exposée sur Internet, non corrigée, exploitée sans authentification
attack_chain: [T1190, T1059.004, T1505.003, T1556, T1078.002, T1003.003, T1021.001, T1560.001, T1041]
impact: {D: 2, I: 3, C: 4, T: 3}
cout_min: 100000
cout_max: 2000000
duree_semaines: {min: 3, max: 12}
phase_detection_semaines: {min: 1, max: 8}
obligations_declenchees: [nis2_24h, lpm_24h, hds_signalement, cnil_72h, nis2_72h, nis2_1mois]
donnees_personnelles: true
impact_reputation: {utilisateurs: -3, partenaires: -5, regulateurs: -3, presse: -4}
mesures_cles: [M26, M08, M27, M13, M14, M29]
references:
  - "CERT-FR, CERTFR-2024-ALE-001 — Multiples vulnérabilités dans Ivanti Connect Secure et Policy Secure"
  - "CISA, Emergency Directive 24-01 — Mitigate Ivanti Connect Secure and Ivanti Policy Secure Vulnerabilities (janvier 2024)"
  - "Ivanti, avis de sécurité CVE-2023-46805 et CVE-2024-21887 (10 janvier 2024)"
  - "ANSSI, Guide d'hygiène informatique, mesures 23 (services exposés) et 34 (mises à jour)"
rex: >
  La passerelle VPN est par nature exposée sur Internet et fait le lien avec le réseau
  interne : c'est un équipement à surveiller en priorité. L'exploitation a commencé avant
  la publication des vulnérabilités, puis s'est généralisée dès la publication de
  l'analyse technique ; appliquer les mesures de contournement dans les heures qui suivent
  une alerte du CERT-FR est déterminant. Une fois l'équipement compromis, on ne peut plus se
  fier à son état : réinitialisation, renouvellement des secrets et recherche de rebond
  dans le réseau interne s'imposent.
messages:
  detection:
    - {de: "Veille CERT-FR", texte: "Alerte : vulnérabilités critiques activement exploitées sur Ivanti Connect Secure. Mesure de contournement disponible, correctif à venir."}
    - {de: "Équipe réseau", texte: "L'outil de vérification d'intégrité de l'éditeur signale des fichiers inconnus sur notre passerelle VPN."}
  confinement:
    - {de: "Équipe réseau", texte: "Si nous coupons la passerelle, les personnels nomades et les prestataires perdent leur accès."}
  eradication:
    - {de: "Prestataire de réponse", texte: "Un compte d'administration du domaine a été utilisé depuis l'adresse interne de la passerelle. La base des comptes de l'annuaire a été copiée."}
  reprise:
    - {de: "DSI", texte: "L'éditeur publie les correctifs définitifs. Comment remettre l'accès distant en service ?"}
decisions:
  - id: D1
    heure: 1
    phase: confinement
    de: "Responsable réseau"
    urgence: true
    delai_secondes: 90
    texte: >
      La passerelle présente des signes de compromission. Que faites-vous immédiatement ?
    choix:
      - id: A
        texte: Isoler la passerelle, collecter les éléments d'investigation, basculer les accès vitaux sur une solution de secours
        qualite: bonne
        effets: {cout_mult: 0.75, reputation: {utilisateurs: -1}}
        feedback: >
          Couper l'accès de l'attaquant au réseau interne est prioritaire ; une solution de
          secours prévue d'avance limite l'impact pour les personnels distants.
        reference: "CERT-FR, CERTFR-2024-ALE-001"
      - id: B
        texte: Appliquer la mesure de contournement de l'éditeur et laisser la passerelle en service
        qualite: moyenne
        effets: {cout_mult: 1.1, risque: [{type: vpn_exploit, facteur: 1.2, semaines: 12}]}
        feedback: >
          La mesure de contournement protège un équipement sain, mais n'évince pas un
          attaquant déjà installé sur une passerelle compromise.
        reference: "CISA, Emergency Directive 24-01"
      - id: C
        texte: Attendre le correctif définitif pour limiter la gêne des utilisateurs
        qualite: mauvaise
        defaut: true
        effets: {cout_mult: 1.6, duree_semaines: 3, reputation: {partenaires: -3, regulateurs: -3}}
        feedback: >
          L'attaquant conserve un accès direct au réseau interne pendant des jours. La
          continuité de service ne justifie pas de laisser une porte ouverte.
        reference: "CERT-FR, CERTFR-2024-ALE-001"
  - id: D2
    heure: 8
    phase: confinement
    de: "Direction générale"
    texte: >
      Faut-il signaler l'incident maintenant, alors que l'ampleur du rebond n'est pas connue ?
    choix:
      - id: A
        texte: Signaler à l'ANSSI / CERT-FR et à l'autorité compétente, déposer plainte, informer les partenaires interconnectés
        qualite: bonne
        effets: {reputation: {regulateurs: 4, partenaires: 2}}
        feedback: >
          L'alerte précoce permet de recevoir des indicateurs de compromission à jour et
          protège les partenaires qui partagent des interconnexions.
        reference: "Directive (UE) 2022/2555 (NIS2), art. 23"
      - id: B
        texte: Signaler uniquement si des données ont été volées
        qualite: mauvaise
        defaut: true
        effets: {reputation: {regulateurs: -5}}
        feedback: >
          L'obligation d'alerte précoce vise l'incident important, pas seulement la fuite
          avérée. Attendre la certitude fait manquer le délai.
        reference: "Directive (UE) 2022/2555 (NIS2), art. 23"
      - id: C
        texte: Informer l'assureur et le prestataire de réponse, signaler plus tard
        qualite: moyenne
        effets: {reputation: {regulateurs: -1}}
        feedback: >
          L'appui externe est utile, mais ne dispense pas des notifications réglementaires
          dans les délais.
        reference: "Code des assurances, art. L.12-10-1"
  - id: D3
    heure: 48
    phase: eradication
    de: "Prestataire de réponse"
    texte: >
      Le rebond vers l'annuaire est confirmé et la base des comptes a été copiée. Quelle
      remédiation engagez-vous ?
    choix:
      - id: A
        texte: Plan de remédiation de l'annuaire (double réinitialisation du compte krbtgt, comptes privilégiés, comptes de service) et réinitialisation de tous les mots de passe VPN
        qualite: bonne
        effets: {cout_fixe: 70000, duree_semaines: 2, risque: [{type: vpn_exploit, facteur: 0.7, semaines: 52}, {type: ransomware, facteur: 0.8, semaines: 26}]}
        feedback: >
          Avec la base des comptes, l'attaquant peut revenir à tout moment. Seul un
          renouvellement complet et ordonné des secrets permet de l'évincer.
        reference: "ANSSI, Remédiation de l'Active Directory (2023)"
      - id: B
        texte: Réinitialiser uniquement le compte d'administration utilisé par l'attaquant
        qualite: mauvaise
        defaut: true
        effets: {duree_semaines: 1, risque: [{type: ransomware, facteur: 1.6, semaines: 26}, {type: vpn_exploit, facteur: 1.3, semaines: 26}]}
        feedback: >
          L'attaquant dispose des empreintes de tous les comptes. Ce type d'accès est souvent
          revendu à des groupes de rançongiciel.
        reference: "ANSSI, Remédiation de l'Active Directory (2023)"
      - id: C
        texte: Réinitialiser les mots de passe de tous les utilisateurs, sans traiter les comptes techniques
        qualite: moyenne
        effets: {cout_fixe: 20000, risque: [{type: ransomware, facteur: 1.1, semaines: 26}]}
        feedback: >
          Progrès réel, mais les comptes de service et le compte krbtgt restent des portes
          d'entrée pour l'attaquant.
        reference: "ANSSI, Guide d'hygiène informatique, mesure 5 (inventaire des comptes privilégiés)"
  - id: D4
    heure: 120
    phase: reprise
    de: "DSI"
    texte: >
      Comment remettez-vous l'accès distant en service ?
    choix:
      - id: A
        texte: Réinitialiser la passerelle aux paramètres d'usine, appliquer les correctifs, renouveler certificats et secrets, puis surveiller ses journaux
        qualite: bonne
        effets: {cout_fixe: 15000, duree_semaines: 1, risque: [{type: vpn_exploit, facteur: 0.6, semaines: 52}]}
        feedback: >
          Un équipement compromis ne doit pas être simplement corrigé : il faut repartir d'un
          état sain et considérer comme exposés tous les secrets qu'il contenait.
        reference: "CISA, Emergency Directive 24-01 et directives complémentaires"
      - id: B
        texte: Appliquer le correctif et remettre en service immédiatement
        qualite: mauvaise
        defaut: true
        effets: {duree_semaines: -1, risque: [{type: vpn_exploit, facteur: 1.5, semaines: 26}]}
        feedback: >
          Le correctif n'efface pas la persistance installée par l'attaquant.
        reference: "Ivanti, avis de sécurité du 10 janvier 2024"
      - id: C
        texte: Engager le remplacement de l'accès VPN par une architecture d'accès à moindre privilège, avec une passerelle réinstallée en attendant
        qualite: moyenne
        effets: {cout_fixe: 60000, duree_semaines: 2, risque: [{type: vpn_exploit, facteur: 0.5, semaines: 104}]}
        feedback: >
          Orientation pertinente à moyen terme, mais coûteuse et longue : elle ne dispense pas
          de remettre d'abord en service un accès sain.
        reference: "ANSSI, Guide d'hygiène informatique, mesure 23 (cloisonner les services exposés)"
