description: >
  Établissement public de santé de 200 lits : urgences, bloc opératoire, maternité, imagerie
  et laboratoire. Le SI fait tourner le dossier patient informatisé, l'imagerie et des centaines
  d'équipements biomédicaux connectés. L'équipe informatique est réduite et le parc vieillissant.
enjeux:
  - "Continuité des soins : une indisponibilité du SI impose le mode dégradé papier et des transferts de patients."
  - "Secret médical et données de santé (données sensibles au sens de l'article 9 du RGPD)."
  - "Secteur particulièrement ciblé par les rançongiciels selon les panoramas de l'ANSSI."
  - "Équipements biomédicaux difficiles à corriger et à cloisonner."
valeurs_metier:
  - "Prise en charge des patients (urgences, bloc, hospitalisation)"
  - "Continuité des examens d'imagerie et de biologie"
  - "Confidentialité du secret médical"
