# Catalogue des 40 mesures de sécurité — RSSI Simulator
# Licence des contenus : CC BY-SA 4.0
#
# Coûts : ordres de grandeur de marché France 2024 (fourchettes du cahier des charges,
# CESIN / Hiscox / UGAP / catalogues publics). Ils sont calculés pour chaque organisation :
#   coût = cout_deploiement + cout_par_employe × employés + cout_par_poste × postes
#          + cout_par_membre_ssi × équipe SSI, borné par [cout_min, cout_max].
# reduction_risque : baisse de la PROBABILITÉ d'occurrence par type d'incident (0-1).
# reduction_impact : baisse du COÛT / de la GRAVITÉ si l'incident survient (0-1).
# detection : réduction du délai de détection (0-1).
# hygiene : n° des mesures du Guide d'hygiène informatique ANSSI (2017) couvertes.
# controle_iso : contrôles de l'annexe A d'ISO/IEC 27001:2022 couverts.
# Types : ransomware, phishing, fuite_donnees, supply_chain, vpn_exploit, ddos,
#         initie, double_extorsion, compromission_cloud, ot_iot

mesures:
  # ------------------------------------------------------------------ Formation
  - id: M01
    nom: Sensibilisation SSI de tout le personnel (e-learning)
    categorie: formation
    type: prevention
    description: >
      Module e-learning annuel et campagnes de faux hameçonnage pour l'ensemble des agents
      et salariés. Réduit fortement l'efficacité des courriels piégés.
    controle_iso: ["6.3"]
    guide_anssi: "Guide d'hygiène informatique ANSSI, mesure 2 ; SecNumacadémie"
    hygiene: [2]
    cout_deploiement: 0
    cout_par_employe: 45
    maintenance_par_employe: 45
    delai_semaines: 4
    maintenance_annuelle: 0
    reduction_risque: {phishing: 0.30, compromission_cloud: 0.20, ransomware: 0.15, double_extorsion: 0.15}

  - id: M02
    nom: Formation RGPD du personnel
    categorie: formation
    type: gouvernance
    description: >
      Formation aux principes de protection des données (minimisation, droits des personnes,
      signalement des violations). Mission de sensibilisation du DPO (RGPD art. 39).
    controle_iso: ["5.34", "6.3"]
    guide_anssi: "Guide CNIL de la sécurité des données personnelles (2024), fiche 1"
    hygiene: []
    cout_deploiement: 2000
    cout_par_employe: 15
    maintenance_par_employe: 10
    delai_semaines: 6
    maintenance_annuelle: 0
    reduction_risque: {fuite_donnees: 0.10, initie: 0.05}
    conformite: [formation_rgpd]

  - id: M03
    nom: Formation spécialisée de l'équipe SSI
    categorie: formation
    type: detection
    description: >
      Formations techniques certifiantes (gestion d'incident, investigation, durcissement)
      pour chaque membre de l'équipe SSI.
    controle_iso: ["6.3", "5.24"]
    guide_anssi: "Guide d'hygiène informatique ANSSI, mesure 1"
    hygiene: [1]
    cout_deploiement: 0
    cout_par_membre_ssi: 2500
    maintenance_annuelle: 0
    maintenance_par_employe: 0
    delai_semaines: 8
    detection: 0.10
    reduction_risque: {tous: 0.05}
    reduction_impact: {tous: 0.05}

  - id: M04
    nom: Exercice de crise cyber annuel
    categorie: formation
    type: reponse
    description: >
      Exercice sur table ou simulation avec la direction, la communication, le juridique et la DSI.
      Entraîne la cellule de crise et valide les modèles de notification.
    controle_iso: ["5.24", "5.26", "5.29"]
    guide_anssi: "Guide ANSSI « Organiser un exercice de gestion de crise cyber » (2021)"
    hygiene: [40]
    cout_deploiement: 6000
    maintenance_annuelle: 6000
    delai_semaines: 6
    reduction_risque: {}
    reduction_impact: {tous: 0.15}

