# Publie une release GitHub avec les exécutables Windows et Linux à chaque tag v*
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            exe: rssi-simulator.exe
            asset: rssi-simulator-windows.exe
          - os: ubuntu-22.04   # glibc ancienne : binaire compatible avec plus de distributions
            sep: ":"
            exe: rssi-simulator
            asset: rssi-simulator-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py --sep "${{ matrix.sep }}"
      - run: mv dist/${{ matrix.exe }} dist/${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: RSSI Simulator ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
